<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarGuardian — Ford Donnacona</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f4f6fb; color: #1a1a2e; }
    .header { background: linear-gradient(135deg, #002366 0%, #003087 100%); padding: 0; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .top-bar-text { color: rgba(255,255,255,0.75); font-size: 12px; }
    .lang-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .header-main { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 14px; }
    .dealer-name { color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 2px; }
    .tagline { color: #f0b429; font-size: 12px; font-style: italic; }
    .hero { background: linear-gradient(160deg, #002366 0%, #001a4d 100%); padding: 36px 24px 32px; text-align: center; }
    .hero-title { color: #fff; font-size: 26px; font-weight: bold; margin-bottom: 8px; }
    .hero-sub { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 24px; max-width: 320px; margin-left: auto; margin-right: auto; line-height: 1.5; }
    .morning-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(240,180,41,0.15); border: 1px solid rgba(240,180,41,0.4); border-radius: 20px; padding: 5px 14px; color: #f0b429; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
    .search-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 20px 16px; max-width: 480px; margin: 0 auto; }
    .search-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; font-family: Georgia, serif; outline: none; margin-bottom: 10px; }
    .search-input::placeholder { color: rgba(255,255,255,0.45); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .label { color: rgba(255,255,255,0.6); font-size: 11px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; font-family: Georgia, serif; outline: none; }
    .price-display { color: #f0b429; font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 6px; }
    .range-input { width: 100%; accent-color: #f0b429; margin-bottom: 10px; }
    .search-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #f0b429 0%, #d4971a 100%); color: #002366; font-weight: bold; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; font-family: Georgia, serif; margin-top: 4px; }
    .results-section { padding: 20px 16px; max-width: 540px; margin: 0 auto; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .results-count { font-size: 14px; color: #444; font-style: italic; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,35,102,0.08); margin-bottom: 14px; overflow: hidden; border: 1px solid rgba(0,35,102,0.07); }
    .card-header { background: linear-gradient(135deg, #002366 0%, #003087 100%); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .card-title { color: #fff; font-size: 15px; font-weight: bold; }
    .card-year { color: #f0b429; font-size: 13px; font-weight: bold; }
    .card-body { padding: 14px 16px; }
    .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #eee; }
    .card-price { font-size: 22px; font-weight: bold; color: #002366; margin-bottom: 6px; }
    .card-meta { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; font-size: 12px; color: #666; }
    .badge-new { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; background: rgba(0,35,102,0.1); color: #002366; border: 1px solid rgba(0,35,102,0.2); }
    .badge-used { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; background: rgba(240,180,41,0.15); color: #a07000; border: 1px solid rgba(240,180,41,0.3); }
    .badge-today { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; margin-left: 6px; }
    .source-tag { font-size: 10px; color: #999; font-style: italic; margin-bottom: 8px; }
    .card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .btn-primary { padding: 10px; background: linear-gradient(135deg, #002366 0%, #003087 100%); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; font-family: Georgia, serif; }
    .btn-secondary { padding: 10px; background: #fff; color: #002366; border: 1.5px solid #002366; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; font-family: Georgia, serif; }
    .alert-section { background: linear-gradient(135deg, #002366 0%, #001a4d 100%); padding: 28px 24px; text-align: center; }
    .alert-title { color: #f0b429; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .alert-sub { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
    .alert-input { width: 100%; max-width: 300px; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; font-family: Georgia, serif; outline: none; display: block; margin: 0 auto 12px; }
    .alert-btn { padding: 12px 28px; background: #f0b429; color: #002366; font-weight: bold; font-size: 14px; border: none; border-radius: 10px; cursor: pointer; font-family: Georgia, serif; }
    .footer { background: #1a1a2e; color: rgba(255,255,255,0.5); text-align: center; padding: 20px 16px; font-size: 11px; line-height: 1.8; }
    .loader { text-align: center; padding: 40px 0; color: #002366; font-size: 14px; font-style: italic; }
    .error-msg { text-align: center; padding: 20px; color: #c00; font-style: italic; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const t = {
      fr: {
        tagline: "On dépasse vos attentes",
        heroTitle: "Trouvez votre prochain véhicule Ford",
        heroSub: "Recherchez parmi des milliers de véhicules dans votre région",
        searchPlaceholder: "Modèle, mots-clés...",
        locationLabel: "Région",
        maxPrice: "Prix maximum",
        condition: "Condition",
        all: "Tous", new: "Neuf", used: "Occasion",
        searchBtn: "Rechercher",
        results: "résultats trouvés",
        newBadge: "NEUF", usedBadge: "OCCASION",
        viewDetails: "Voir les détails", contact: "Contacter",
        alertTitle: "Alertes quotidiennes",
        alertSub: "Recevez chaque matin les nouveaux véhicules correspondant à vos critères",
        alertEmail: "Votre courriel",
        activateAlert: "Activer l'alerte",
        morning: "Nouvelles annonces disponibles",
        address: "128 Boul. Les Écureuils, Donnacona, QC",
        todayBadge: "🆕 Nouveau",
        noResults: "Aucun résultat trouvé. Essayez d'élargir votre recherche.",
        loading: "Recherche en cours...",
        lang: "EN", sortNew: "Plus récents", sortPrice: "Prix croissant", sortPriceDesc: "Prix décroissant", sortBy: "Trier par"
      },
      en: {
        tagline: "We exceed your expectations",
        heroTitle: "Find your next Ford vehicle",
        heroSub: "Search thousands of vehicles in your region",
        searchPlaceholder: "Model, keywords...",
        locationLabel: "Region",
        maxPrice: "Max price",
        condition: "Condition",
        all: "All", new: "New", used: "Pre-owned",
        searchBtn: "Search",
        results: "results found",
        newBadge: "NEW", usedBadge: "PRE-OWNED",
        viewDetails: "View details", contact: "Contact",
        alertTitle: "Daily alerts",
        alertSub: "Receive new matching vehicles every morning in your inbox",
        alertEmail: "Your email",
        activateAlert: "Activate alert",
        morning: "New listings available",
        address: "128 Boul. Les Écureuils, Donnacona, QC",
        todayBadge: "🆕 New",
        noResults: "No results found. Try expanding your search.",
        loading: "Searching...",
        lang: "FR", sortNew: "Most recent", sortPrice: "Price: low to high", sortPriceDesc: "Price: high to low", sortBy: "Sort by"
      }
    };

    function FordLogo() {
      return (
        <svg viewBox="0 0 120 50" width="100" height="42" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="25" rx="58" ry="23" fill="#003087" stroke="#fff" strokeWidth="1.5"/>
          <text x="60" y="33" textAnchor="middle" fontFamily="serif" fontSize="22" fontWeight="bold" fill="white" fontStyle="italic" letterSpacing="1">Ford</text>
        </svg>
      );
    }

    function App() {
      const [lang, setLang] = useState("fr");
      const T = t[lang];
      const [model, setModel] = useState("");
      const [maxPrice, setMaxPrice] = useState(100000);
      const [condition, setCondition] = useState("");
      const [sort, setSort] = useState("desc");
      const [listings, setListings] = useState([]);
      const [total, setTotal] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [email, setEmail] = useState("");
      const [alertSet, setAlertSet] = useState(false);
      const [searched, setSearched] = useState(false);

      const formatPrice = (p) => p ? p.toLocaleString("fr-CA", { style: "currency", currency: "CAD", maximumFractionDigits: 0 }) : "Prix sur demande";
      const formatKm = (m) => m ? `${m.toLocaleString()} km` : "";

      const handleSearch = async () => {
        setLoading(true);
        setError("");
        setSearched(true);
        try {
          let url = `/api/search-vehicles?latitude=46.6565&longitude=-71.9228&radius=100&make=Ford&rows=20&sort_by=first_seen_at_mc&sort_order=${sort}`;
          if (condition) url += `&condition=${condition}`;
          if (maxPrice < 100000) url += `&price_max=${maxPrice}`;
          const res = await fetch(url);
          const data = await res.json();
          let results = data.listings || [];
          if (model.trim()) {
            const q = model.toLowerCase();
            results = results.filter(l => l.heading && l.heading.toLowerCase().includes(q));
          }
          setListings(results);
          setTotal(data.num_found || 0);
        } catch(e) {
          setError("Erreur de connexion. Veuillez réessayer.");
        }
        setLoading(false);
      };

      const isToday = (listing) => {
        const ts = listing.first_seen_at_mc;
        if (!ts) return false;
        const d = new Date(ts * 1000);
        const now = new Date();
        return d.toDateString() === now.toDateString();
      };

      const isDonnacona = (listing) => listing.dealer && listing.dealer.website === "forddonnacona.com";

      return (
        <div>
          {/* Header */}
          <div className="header">
            <div className="top-bar">
              <span className="top-bar-text">📍 {T.address}</span>
              <button className="lang-btn" onClick={() => setLang(lang === "fr" ? "en" : "fr")}>{T.lang}</button>
            </div>
            <div className="header-main">
              <div>
                <div className="dealer-name">Ford Donnacona</div>
                <div className="tagline">✦ {T.tagline} ✦</div>
              </div>
              <FordLogo />
            </div>
          </div>

          {/* Hero */}
          <div className="hero">
            <div className="morning-badge">☀️ {T.morning}</div>
            <div className="hero-title">{T.heroTitle}</div>
            <div className="hero-sub">{T.heroSub}</div>
            <div className="search-card">
              <input className="search-input" placeholder={T.searchPlaceholder} value={model} onChange={e => setModel(e.target.value)} />
              <div className="row">
                <div>
                  <div className="label">{T.condition}</div>
                  <select className="select" value={condition} onChange={e => setCondition(e.target.value)}>
                   <option value="">{lang === 'fr' ? 'Tous' : 'All'}</option>
<option value="new">{lang === 'fr' ? 'Neuf' : 'New'}</option>
<option value="used">{lang === 'fr' ? 'Occasion' : 'Pre-owned'}</option>
                  </select>
                </div>
                <div>
                  <div className="label">{T.sortBy}</div>
                  <select className="select" value={sort} onChange={e => setSort(e.target.value)}>
                    <option value="desc">{lang === 'fr' ? 'Plus récents' : 'Most recent'}</option>
<option value="asc">{lang === 'fr' ? 'Prix croissant' : 'Price: low to high'}</option>
<option value="desc_price">{lang === 'fr' ? 'Prix décroissant' : 'Price: high to low'}</option>
                  </select>
                </div>
              </div>
              <div className="price-display">{T.maxPrice}: {formatPrice(maxPrice)}</div>
              <input type="range" min={10000} max={150000} step={1000} value={maxPrice} onChange={e => setMaxPrice(Number(e.target.value))} className="range-input" />
              <button className="search-btn" onClick={handleSearch}>🔍 {T.searchBtn}</button>
            </div>
          </div>

          {/* Results */}
          <div className="results-section">
            {loading && <div className="loader">⏳ {T.loading}</div>}
            {error && <div className="error-msg">{error}</div>}
            {!loading && searched && !error && (
              <>
                <div className="results-header">
                  <div className="results-count"><strong>{total?.toLocaleString()}</strong> {T.results}</div>
                </div>
                {listings.length === 0 && <div className="error-msg">{T.noResults}</div>}
                {listings.map((car, i) => (
                  <div key={car.id} className="card fade-in" style={{animationDelay: `${i * 0.06}s`}}>
                    <div className="card-header">
                      <div className="card-title">{car.heading}</div>
                      <div className="card-year">{car.build?.year}</div>
                    </div>
                    <div className="card-body">
                      {car.media?.photo_links?.[0] && (
                        <img className="card-img" src={car.media.photo_links[0]} alt={car.heading} onError={e => e.target.style.display='none'} />
                      )}
                      <div className="card-price">{formatPrice(car.price)}</div>
                      <div className="card-meta">
                        <span className={car.inventory_type === "new" ? "badge-new" : "badge-used"}>
                          {car.inventory_type === "new" ? T.newBadge : T.usedBadge}
                        </span>
                        {car.miles ? <span>🛣️ {formatKm(car.miles)}</span> : null}
                        {car.dealer?.city ? <span>📍 {car.dealer.city}, {car.dealer.state}</span> : null}
                        {isDonnacona(car) ? <span style={{color:"#003087", fontWeight:"bold"}}>⭐ Ford Donnacona</span> : null}
                        {isToday(car) ? <span className="badge-today">{T.todayBadge}</span> : null}
                      </div>
                      <div className="source-tag">Source: {car.source}</div>
                      <div className="card-btns">
                        <a href={car.vdp_url} target="_blank" rel="noopener noreferrer">
                          <button className="btn-primary" style={{width:"100%"}}>{T.viewDetails}</button>
                        </a>
                        <a href={`tel:${car.dealer?.phone || "4182853311"}`}>
                          <button className="btn-secondary" style={{width:"100%"}}>{T.contact}</button>
                        </a>
                      </div>
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>

          {/* Alert */}
          <div className="alert-section">
            {!alertSet ? (
              <>
                <div className="alert-title">☀️ {T.alertTitle}</div>
                <div className="alert-sub">{T.alertSub}</div>
                <input className="alert-input" placeholder={T.alertEmail} value={email} onChange={e => setEmail(e.target.value)} />
                <button className="alert-btn" onClick={() => email && setAlertSet(true)}>{T.activateAlert}</button>
              </>
            ) : (
              <div style={{color:"#fff", fontSize:16}}>✅ {lang === "fr" ? `Alerte activée pour ${email}` : `Alert set for ${email}`}</div>
            )}
          </div>

          {/* Footer */}
          <div className="footer">
            <div style={{marginBottom:8}}><FordLogo /></div>
            <div><strong style={{color:"#fff"}}>Ford Donnacona</strong></div>
            <div>128 Boulevard Les Écureuils, Donnacona, QC G3M 0J2</div>
            <div style={{marginTop:6, color:"rgba(255,255,255,0.3)", fontSize:10}}>
              © 2026 CarGuardian · Propulsé par CarGuardian.ai
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
